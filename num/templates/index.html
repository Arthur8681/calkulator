<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор WebSocket</title>
</head>
<body>
    <h2>Калькулятор по WS</h2>
    <input type="number" id="num1" placeholder="Число 1">
    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" id="num2" placeholder="Число 2">
    <button id="btn">Посчитать</button>

    <h3>Результат: <span id="res">-</span></h3>

    <script>
        const socket = new WebSocket('ws://' + window.location.host + '/ws/calc/');

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            document.getElementById('res').innerText = data.result;
        };

        document.getElementById('btn').onclick = function() {
            socket.send(JSON.stringify({
                num1: document.getElementById('num1').value,
                num2: document.getElementById('num2').value,
                operation: document.getElementById('operation').value
            }));
        };
    </script>
</body>
</html>
